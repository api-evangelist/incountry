aid: incountry
name: InCountry
description: >-
  InCountry is a data-residency-as-a-service (DRaaS) platform that lets companies
  store, process, and comply with the data-localization and privacy laws of specific
  countries without building in-country infrastructure. Its OAuth2-secured REST API
  stores regulated records (PII, financial, and health data) inside a chosen country's
  borders using AES-GCM 256-bit encryption, exposing CRUD, batch, search, aggregate,
  clone, and attachment operations keyed by country and record key. InCountry also
  operates AgentCloak, a hosted Model Context Protocol (MCP) server that anonymizes
  (cloaks) and restores (uncloaks) personally identifiable information for AI agents.
  The platform supports data residency across 90+ jurisdictions and is certified
  against SOC 2 Type II, ISO 27001, ISO 27701, PCI DSS, and HIPAA.
